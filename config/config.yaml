# ═══════════════════════════════════════════════════════════════
#                    TrendRadar 配置文件
#                      Version: 2.5.0
# ═══════════════════════════════════════════════════════════════


# 可视化配置编辑器地址: https://sansan0.github.io/TrendRadar/


# ===============================================================
# 1. 基础设置
# ===============================================================
app:
  timezone: "Asia/Shanghai"
  show_version_update: true


# ===============================================================
# 1.5 调度系统 —— 什么时间做什么事
# ===============================================================
schedule:
  enabled: false
  preset: "morning_evening"


# ===============================================================
# 2. 数据源 - 热榜平台（已关闭娱乐与大众热搜）
# ===============================================================
platforms:
  enabled: false
  api_url: ""
  sources:
    - id: "toutiao"
      name: "今日头条"
      expected_domain: "toutiao.com"
    - id: "baidu"
      name: "百度热搜"
      expected_domain: "baidu.com"
    - id: "wallstreetcn-hot"
      name: "华尔街见闻"
      expected_domain: "wallstreetcn.com"
    - id: "thepaper"
      name: "澎湃新闻"
      expected_domain: "thepaper.cn"
    - id: "bilibili-hot-search"
      name: "bilibili 热搜"
      expected_domain: "bilibili.com"
    - id: "cls-hot"
      name: "财联社热门"
      expected_domain: "cls.cn"
    - id: "ifeng"
      name: "凤凰网"
      expected_domain: "ifeng.com"
    - id: "tieba"
      name: "贴吧"
      expected_domain: "baidu.com"
    - id: "weibo"
      name: "微博"
      expected_domain: "weibo.com"
    - id: "douyin"
      name: "抖音"
      expected_domain: "douyin.com"
    - id: "zhihu"
      name: "知乎"
      expected_domain: "zhihu.com"


# ===============================================================
# 3. 数据源 - RSS 订阅（已替换为 AI 优惠 / 科技动态 / GitHub 热门）
# ===============================================================
rss:
  enabled: true

  freshness_filter:
    enabled: true
    max_age_days: 1

  feeds:
    - id: "linux-do"
      name: "Linux.do 羊毛与AI快讯"
      url: "https://linux.do/latest.rss"

    - id: "hacker-news"
      name: "Hacker News 高赞科技"
      url: "https://hnrss.org/frontpage?points=150"

    - id: "github-trending"
      name: "GitHub 每日飙升"
      url: "https://mshibanami.github.io/GitHubTrendingRSS/daily/all.xml"

    - id: "reddit-claude"
      name: "Reddit ClaudeAI"
      url: "https://www.reddit.com/r/ClaudeAI/top/.rss?t=day"

    - id: "reddit-gemini"
      name: "Reddit GeminiAI"
      url: "https://www.reddit.com/r/GoogleGeminiAI/top/.rss?t=day"

    - id: "reddit-openai"
      name: "Reddit OpenAI"
      url: "https://www.reddit.com/r/OpenAI/top/.rss?t=day"


# ===============================================================
# 3.5 数据源 - 联网搜索
# ===============================================================
web_search:
  enabled: false
  provider: "deepseek"
  queries_file: ""
  query_mode: "direct"
  fetch_count: 20
  max_items_per_topic: 8
  freshness_days: 7
  dedup_days: 7
  min_score: 0.5
  min_authority: -1
  allow_unknown_authority: true
  need_content: false
  notification_show_snippet: false
  providers:
    deepseek:
      api_key: ""
      api_base: "https://api.deepseek.com"
      localization: ""


# ===============================================================
# 4. 报告模式（增量模式，只推新增不重复）
# ===============================================================
report:
  mode: "incremental"
  display_mode: "keyword"
  sort_by_position_first: false
  rank_threshold: 5
  max_news_per_keyword: 0


# ===============================================================
# 4.5 筛选策略（已开启 AI 智能筛选）
# ===============================================================
filter:
  method: "ai"
  priority_sort_enabled: true


# ===============================================================
# 4.6 AI 智能筛选配置
# ===============================================================
ai_filter:
  batch_size: 200
  batch_interval: 2
  min_score: 0.7
  reclassify_threshold: 0.6
  prompt_file: "prompt.txt"
  extract_prompt_file: "extract_prompt.txt"
  update_tags_prompt_file: "update_tags_prompt.txt"


# ===============================================================
# 5. 推送内容控制
# ===============================================================
display:
  region_order:
    - new_items
    - hotlist
    - rss
    - web_search
    - standalone
    - ai_analysis

  regions:
    hotlist: false
    new_items: false
    rss: true
    web_search: false
    standalone: false
    ai_analysis: true

  standalone:
    platforms: ["zhihu", "wallstreetcn-hot"]
    rss_feeds: []
    max_items: 20


# ===============================================================
# 6. 推送通知（留空，自动读取 GitHub Secrets）
# ===============================================================
notification:
  enabled: true
  channels:
    feishu:
      webhook_url: ""
    dingtalk:
      webhook_url: ""
    wework:
      webhook_url: ""
      msg_type: "markdown"
    telegram:
      bot_token: ""
      chat_id: ""
    email:
      from: ""
      password: ""
      to: ""
      smtp_server: ""
      smtp_port: ""
    ntfy:
      server_url: "https://ntfy.sh"
      topic: ""
      token: ""
    bark:
      url: ""
    slack:
      webhook_url: ""
    generic_webhook:
      webhook_url: ""
      payload_template: ""


# ===============================================================
# 7. 存储配置
# ===============================================================
storage:
  backend: "auto"
  formats:
    sqlite: true
    txt: false
    html: true
  local:
    data_dir: "output"
    retention_days: 0
  remote:
    retention_days: 0
    endpoint_url: ""
    bucket_name: ""
    access_key_id: ""
    secret_access_key: ""
    region: ""
  pull:
    enabled: false
    days: 7


# ===============================================================
# 8. AI 模型配置（留空，自动读取 GitHub Secrets）
# ===============================================================
ai:
  model: "deepseek/deepseek-v4-flash"
  api_key: ""
  api_base: ""
  timeout: 120
  temperature: 1.0
  max_tokens: 5000
  num_retries: 1
  fallback_models: []


# ===============================================================
# 9. AI 分析功能（已开启 RSS 内容中文总结）
# ===============================================================
ai_analysis:
  enabled: true
  language: "Chinese"
  prompt_file: "ai_analysis_prompt.txt"
  mode: "follow_report"
  max_news_for_analysis: 150
  include_rss: true
  include_web_search: false
  search_summary_max_chars: 300
  include_standalone: false
  include_rank_timeline: false


# ===============================================================
# 10. AI 翻译功能（已开启 RSS 英文标题转中文）
# ===============================================================
ai_translation:
  enabled: true
  language: "中文"
  prompt_file: "ai_translation_prompt.txt"
  batch_size: 100
  batch_interval: 2
  scope:
    hotlist: false
    rss: true
    web_search: false
    standalone: false


# ===============================================================
# 11. 高级设置
# ===============================================================
advanced:
  debug: false
  version_check_url: "https://raw.githubusercontent.com/sansan0/TrendRadar/refs/heads/master/version"
  mcp_version_check_url: "https://raw.githubusercontent.com/sansan0/TrendRadar/refs/heads/master/version_mcp"
  configs_version_check_url: "https://raw.githubusercontent.com/sansan0/TrendRadar/refs/heads/master/version_configs"
  crawler:
    request_interval: 2000
    use_proxy: false
    default_proxy: "http://127.0.0.1:10801"
  rss:
    request_interval: 1000
    timeout: 15
    use_proxy: false
    proxy_url: ""
  web_search:
    request_interval: 1000
    timeout: 20
    max_retries: 2
    use_proxy: false
    proxy_url: ""
  weight:
    rank: 0.6
    frequency: 0.3
    hotness: 0.1
  max_accounts_per_channel: 3
  batch_size:
    default: 4000
    dingtalk: 20000
    feishu: 30000
    bark: 4000
    slack: 4000
  batch_send_interval: 3
  feishu_message_separator: "━━━━━━━━━━━━━━━━"
